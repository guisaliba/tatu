services:
  app:
    extends:
      file: docker-compose.base.yml
      service: app
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.prod
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"
    healthcheck:
      interval: 30s
      timeout: 10s
